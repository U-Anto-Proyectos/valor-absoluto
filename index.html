<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Valor Absoluto</title>
  <meta name="description" content="Aprende a resolver ecuaciones con valor absoluto construyendo la solución, línea por línea.">
  <meta name="theme-color" content="#F6F3EC">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- sin zoom y aviso antes de actualizar; guía con la mano para quien empieza -->
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/coach.js"></script>
</head>
<body>
  <div class="scene-wrap" id="scene"></div>
  <div class="dock" id="dock"><div class="bubble" id="bubble"></div><div id="broteDock"></div></div>

  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Valor Absoluto con el prof. Anto — Inicio">
      <span class="mark">|<i>x</i>|</span><span class="name">Valor Absoluto <span class="by">con el prof. Anto</span></span>
    </button>
    <div class="levels" id="levels" role="tablist" aria-label="Dificultad">
      <span class="ind" id="ind"></span>
      <button class="lv" role="tab" data-level="desde0" style="--c:#3AA7A3">Desde 0</button>
      <button class="lv" role="tab" data-level="facil" style="--c:#2E9E6A">Fácil</button>
      <button class="lv" role="tab" data-level="medio" style="--c:#0071E3">Medio</button>
      <button class="lv" role="tab" data-level="alto" style="--c:#7A5AF8">Alto</button>
    </div>
    <div class="hud">
      <span class="chip" id="xpChip" title="Experiencia"><span id="xpIcon"></span><span id="xpVal">0</span><small>XP</small></span>
      <span class="chip streak" id="streakChip" title="Ejercicios seguidos sin errores"><span id="flame"></span><span id="streakVal">0</span><small>seguidos</small></span>
      <button class="chip" id="goalChip" title="Tu sesión"><span id="goalRing"></span><span id="goalVal">0/5</span></button>
    </div>
  </header>

  <main>
    <section class="view" id="home" aria-label="Inicio">
      <div class="hero">
        <p class="big">|<i>x</i>|</p>
        <h1>Valor Absoluto</h1>
        <p>Construye la solución, línea por línea.</p>
        <div class="cards">
          <button class="lcard glass" data-level="desde0" style="--c:#3AA7A3"><div class="eqbox">|−5|</div><h3>Desde 0</h3><p>Distancia</p></button>
          <button class="lcard glass" data-level="facil" style="--c:#2E9E6A"><div class="eqbox">|<i>x</i> + 2| = 5</div><h3>Fácil</h3><p>Dos casos</p></button>
          <button class="lcard glass" data-level="medio" style="--c:#0071E3"><div class="eqbox">|3<i>x</i> − 1| = 8</div><h3>Medio</h3><p>Despejar</p></button>
          <button class="lcard glass" data-level="alto" style="--c:#7A5AF8"><div class="eqbox sm">2|<i>x</i> − 1| + 3 = 11</div><h3>Alto</h3><p>Aislar y razonar</p></button>
        </div>
      </div>
    </section>

    <section class="view" id="play" aria-label="Resolver">
      <div class="play-grid">
        <article class="sheet glass" id="sheet" aria-label="Resolución">
          <header class="sheet-head"><span class="tag" id="tag"></span><span class="dots" id="dots" aria-hidden="true"></span></header>
          <div class="lines" id="lines" aria-live="polite"></div>
          <div class="explore is-hidden" id="explore"></div>
          <div class="slot" id="slot" aria-hidden="true">?</div>
        </article>
        <aside class="panel" id="panel" aria-label="Siguiente paso">
          <div class="cap" id="cap">Siguiente paso</div>
          <div id="hintBox"></div>
          <div id="tool"></div>
          <div class="opts" id="opts"></div>
          <footer class="panel-foot" id="foot">
            <button class="icon-btn" id="hintBtn" aria-label="Pista">?</button><span class="foot-lab">Pista</span>
            <button class="icon-btn pm is-hidden" id="pmBtn" aria-label="Explorador más o menos">±</button><span class="foot-lab is-hidden" id="pmLab">Explorar</span>
          </footer>
          <div class="done glass is-hidden" id="done"></div>
        </aside>
      </div>
    </section>

    <section class="view" id="progress" aria-label="Progreso">
      <div class="prog glass" id="prog"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <div class="sr" id="live" aria-live="assertive"></div>
  <script type="module" src="assets/js/app.js"></script>
  <script>
    // aviso antes de actualizar: solo mientras se resuelve un ejercicio
    window.leaveGuard = function () { return !!document.querySelector('#play.is-on'); };
    // tutorial: la mano enseña qué tocar o arrastrar (insiste al inicio y luego se retira)
    // trazos que la mano debe hacer en la recta: desde el centro hasta cada punto que falta
    function trazosRecta() {
      var nl = document.querySelector('#play.is-on .explore:not(.is-done) .nline');
      if (!nl || nl.querySelector('.nl-knob')) return null;
      var hit = function (v) { return nl.querySelector('.nl-hit[data-v="' + v + '"]'); };
      var c = hit(Number(nl.dataset.center || 0));
      var tg = (nl.dataset.targets || '').split(' ').filter(Boolean).map(Number);
      var falta = tg.filter(function (v) { var h = hit(v); return h && !h.classList.contains('is-found'); });
      return falta.map(function (v) { return { from: c, to: hit(v) }; });
    }
    Coach.init({
      key: 'valor-absoluto:coach',
      color: '#0071E3',
      groups: [
        { sel: '#home.is-on .lcard[data-level="desde0"]', single: true, noviceOnly: true, tip: 'Empieza aquí' },
        // arrastrar: la mano lleva el punto desde donde está hasta la meta, por el mismo camino que el dedo
        { sel: '#play.is-on .explore:not(.is-done) .nl-knob', drag: '#play.is-on .explore:not(.is-done) .nl-goal circle', always: true, delay: 900 },
        // tocar puntos: la mano hace cada trazo, del centro al punto, y lo toca (si son dos, los dos)
        { sel: '#play.is-on .explore:not(.is-done) .nline', single: true, sequence: trazosRecta, always: true, delay: 1200 },
        // jalar el explorador ±: la mano hace el gesto hacia abajo
        { sel: '#play.is-on #tool .pm-card .pm-handle', dragBy: [0, 70], always: true, delay: 500 },
        { sel: '#play.is-on #opts:not(.is-hidden) .opt:not(:disabled)' },
        { sel: '#play.is-on #done:not(.is-hidden) #nextBtn', single: true }
      ]
    });
  </script>
</body>
</html>
